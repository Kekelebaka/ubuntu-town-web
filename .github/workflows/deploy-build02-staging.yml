name: Deploy Build 02 to Staging

# Deploys the Build 02 mission work engine to the staging Cloudflare Pages project.
# Uses staging Supabase (lgbkfthojyxhwemgkpgo). HARD REFUSES production.

on:
  workflow_dispatch: {}

concurrency:
  group: build02-staging-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      STAGING_REF: lgbkfthojyxhwemgkpgo
      PRODUCTION_REF: afiokbhuxfdacbsipoqk
      CF_PAGES_PROJECT: ubuntu-town-workspace-v2-staging
      NEXT_PUBLIC_SITE_URL: https://ubuntu-town-workspace-v2-staging.pages.dev
      NEXT_PUBLIC_RELEASE_SOURCE: build-02-mission-engine
      NEXT_PUBLIC_GIT_BRANCH: workspace-v2/build-02-work-engine
    steps:
      - name: Checkout Build 02 branch
        uses: actions/checkout@v4
        with:
          ref: workspace-v2/build-02-work-engine
          fetch-depth: 1

      - name: Safety guard
        shell: bash
        run: |
          set -euo pipefail
          echo "SHA: $(git rev-parse HEAD)"
          echo "STAGING REF: $STAGING_REF"
          echo "PRODUCTION REF: $PRODUCTION_REF (PROTECTED)"
          if [ "$STAGING_REF" = "$PRODUCTION_REF" ]; then
            echo "🚨 HARD ABORT: staging ref equals production ref"
            exit 10
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure staging env
        shell: bash
        run: |
          cat > .env.local <<EOF
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.STAGING_NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.STAGING_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SITE_URL=$NEXT_PUBLIC_SITE_URL
          NEXT_PUBLIC_GIT_SHA=$(git rev-parse HEAD)
          NEXT_PUBLIC_GIT_BRANCH=$NEXT_PUBLIC_GIT_BRANCH
          NEXT_PUBLIC_RELEASE_SOURCE=$NEXT_PUBLIC_RELEASE_SOURCE
          EOF
          # Verify no production refs leaked in
          if grep -R "afiokbhuxfdacbsipoqk\|enter.ubuntutown.co.za" .env.local; then
            echo "🚨 Production reference found in staging env"
            exit 10
          fi

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build (next + next-on-pages edge)
        run: npm run build:edge
        env:
          NEXT_PUBLIC_GIT_SHA: ${{ github.sha }}
          NEXT_PUBLIC_GIT_BRANCH: workspace-v2/build-02-work-engine
          NEXT_PUBLIC_RELEASE_SOURCE: build-02-mission-engine

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          command: pages deploy .vercel/output/static --project-name=$CF_PAGES_PROJECT --branch=workspace-v2/build-02-work-engine --commit-dirty=true --commit-hash=$(git rev-parse HEAD)
