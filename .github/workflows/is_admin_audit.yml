name: Audit is_admin and province tables
on:
  workflow_dispatch: {}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    env:
      STAGING_REF: lgbkfthojyxhwemgkpgo
      PRODUCTION_REF: afiokbhuxfdacbsipoqk
      PGHOST: aws-1-eu-west-1.pooler.supabase.com
      PGPORT: "5432"
      PGDATABASE: postgres
      PGUSER: postgres.lgbkfthojyxhwemgkpgo
      PGSSLMODE: require
      PGOPTIONS: "-c default_transaction_read_only=on -c statement_timeout=15000 -c lock_timeout=5000"
    steps:
      - name: Safety guard
        shell: bash
        run: |
          set -euo pipefail
          if [ "$STAGING_REF" != "lgbkfthojyxhwemgkpgo" ]; then echo "FAIL"; exit 10; fi
          if [ "$STAGING_REF" = "$PRODUCTION_REF" ]; then echo "FAIL"; exit 10; fi
      - name: Audit
        shell: bash
        env:
          PGPASSWORD: ${{ secrets.H02R_STAGING_DB_PASSWORD }}
        run: |
          set -euo pipefail
          echo "=== is_admin function ==="
          psql --single-transaction --set ON_ERROR_STOP=1 \
            -c "SELECT p.prosrc, p.proowner::regrole, p.prosecdef, p.proconfig
                FROM pg_proc p
                JOIN pg_namespace n ON p.pronamespace=n.oid
                WHERE n.nspname='uto' AND p.proname='is_admin';"
          echo ""
          echo "=== is_admin execute grants ==="
          psql --single-transaction --set ON_ERROR_STOP=1 \
            -c "SELECT grantee, privilege_type
                FROM information_schema.routine_privileges
                WHERE routine_schema='uto' AND routine_name='is_admin';"
          echo ""
          echo "=== Province tables ==="
          psql --single-transaction --set ON_ERROR_STOP=1 \
            -c "SELECT table_schema, table_name
                FROM information_schema.tables
                WHERE table_name LIKE '%province%'
                ORDER BY table_schema, table_name;"
          echo ""
          echo "=== town_status enum ==="
          psql --single-transaction --set ON_ERROR_STOP=1 \
            -c "SELECT e.enumlabel
                FROM pg_type t JOIN pg_enum e ON t.oid=e.enumtypid
                WHERE t.typname='town_status'
                ORDER BY e.enumsortorder;"
          echo ""
          echo "=== set_updated_at trigger on uto.towns ==="
          psql --single-transaction --set ON_ERROR_STOP=1 \
            -c "SELECT tgname, tgtype, tgenabled
                FROM pg_trigger
                WHERE tgrelid='uto.towns'::regclass AND NOT tgisinternal;"
