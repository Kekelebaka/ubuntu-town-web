name: H-02 Living Town V2 Preview

on:
  push:
    branches:
      - h-02-v2-preview-source
    paths:
      - '.github/workflows/h-02-v2-preview.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: h-02-living-town-v2-preview
  cancel-in-progress: true

jobs:
  deploy-v2-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      V2_SHA: bfeb53be0a6ed30ecfdb047b280fd69c66e10133

      CF_ACCOUNT_ID_EXPECTED: c63d3d6d8c17db7487ab40b81d5e29d1
      CF_PROJECT_EXPECTED: ubuntu-town-workspace-v2-staging

      LIVING_TOWN_ENABLED: 'true'
      LIVING_TOWN_MODE: staging
      LIVING_TOWN_OUTBOUND: disabled

      LIVING_TOWN_STAGING_SUPABASE_REF: lgbkfthojyxhwemgkpgo
      LIVING_TOWN_STAGING_ORIGIN: https://ubuntu-town-workspace-v2-staging.pages.dev

      NEXT_PUBLIC_SITE_URL: https://ubuntu-town-workspace-v2-staging.pages.dev
      NEXT_PUBLIC_SUPABASE_URL: https://lgbkfthojyxhwemgkpgo.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      NEXT_PUBLIC_GIT_SHA: bfeb53be0a6ed30ecfdb047b280fd69c66e10133
      NEXT_PUBLIC_GIT_BRANCH: workspace-v2/commission-loop
      NEXT_PUBLIC_RELEASE_SOURCE: h-02-v2-preview

    steps:

      - name: Checkout exact V2
        uses: actions/checkout@v4
        with:
          ref: bfeb53be0a6ed30ecfdb047b280fd69c66e10133
          fetch-depth: 1

      - name: Verify exact source
        shell: bash
        run: |
          set -euo pipefail

          ACTUAL="$(git rev-parse HEAD)"

          echo "EXPECTED=$V2_SHA"
          echo "ACTUAL=$ACTUAL"

          test "$ACTUAL" = "$V2_SHA"

      - name: Guard staging environment
        shell: bash
        run: |
          set -euo pipefail

          test "$CF_PROJECT_EXPECTED" = "ubuntu-town-workspace-v2-staging"
          test "$LIVING_TOWN_STAGING_SUPABASE_REF" = "lgbkfthojyxhwemgkpgo"

          test "$NEXT_PUBLIC_SUPABASE_URL" = \
            "https://lgbkfthojyxhwemgkpgo.supabase.co"

          test "$NEXT_PUBLIC_SITE_URL" = \
            "https://ubuntu-town-workspace-v2-staging.pages.dev"

          test -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"

          if printf '%s\n' \
            "$NEXT_PUBLIC_SUPABASE_URL" \
            "$NEXT_PUBLIC_SITE_URL" \
            | grep -E \
            'afiokbhuxfdacbsipoqk|enter\.ubuntutown\.co\.za|ubuntu-town-web-git'
          then
            echo "PRODUCTION TARGET DETECTED"
            exit 40
          fi

      - name: Create build environment
        shell: bash
        run: |
          cat > .env.local <<EOF
          LIVING_TOWN_ENABLED=true
          LIVING_TOWN_MODE=staging
          LIVING_TOWN_OUTBOUND=disabled
          LIVING_TOWN_STAGING_SUPABASE_REF=lgbkfthojyxhwemgkpgo
          LIVING_TOWN_STAGING_ORIGIN=https://ubuntu-town-workspace-v2-staging.pages.dev
          NEXT_PUBLIC_SITE_URL=https://ubuntu-town-workspace-v2-staging.pages.dev
          NEXT_PUBLIC_SUPABASE_URL=https://lgbkfthojyxhwemgkpgo.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
          NEXT_PUBLIC_GIT_SHA=$V2_SHA
          NEXT_PUBLIC_GIT_BRANCH=workspace-v2/commission-loop
          NEXT_PUBLIC_RELEASE_SOURCE=h-02-v2-preview
          EOF

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate V2 environment
        run: npm run check:v2-env

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build Cloudflare edge artifact
        run: npm run build:edge

      - name: Verify build artifact
        shell: bash
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "$V2_SHA"
          test -f .vercel/output/config.json
          test -d .vercel/output/static

          echo "V2_ARTIFACT=PASS"

      - name: Verify Cloudflare staging target
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          test "$CLOUDFLARE_ACCOUNT_ID" = "$CF_ACCOUNT_ID_EXPECTED"

          python - <<'PY'
          import json
          import os
          import urllib.request

          account = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          token = os.environ["CLOUDFLARE_API_TOKEN"]
          project = os.environ["CF_PROJECT_EXPECTED"]

          url = (
              f"https://api.cloudflare.com/client/v4/accounts/"
              f"{account}/pages/projects/{project}"
          )

          req = urllib.request.Request(
              url,
              headers={"Authorization": f"Bearer {token}"}
          )

          data = json.load(
              urllib.request.urlopen(req, timeout=30)
          )

          assert data["success"]

          result = data["result"]

          print("PROJECT=" + result["name"])
          print("DOMAINS=" + ",".join(result.get("domains") or []))

          assert result["name"] == "ubuntu-town-workspace-v2-staging"

          domains = result.get("domains") or []

          assert "enter.ubuntutown.co.za" not in domains
          PY

      - name: Configure staging runtime bindings
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']; token=os.environ['CLOUDFLARE_API_TOKEN']; project=os.environ['CF_PROJECT_EXPECTED']
          values={k:os.environ[k] for k in ['LIVING_TOWN_ENABLED','LIVING_TOWN_MODE','LIVING_TOWN_OUTBOUND','LIVING_TOWN_STAGING_SUPABASE_REF','LIVING_TOWN_STAGING_ORIGIN','NEXT_PUBLIC_SITE_URL','NEXT_PUBLIC_SUPABASE_URL','NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY','NEXT_PUBLIC_GIT_SHA','NEXT_PUBLIC_GIT_BRANCH','NEXT_PUBLIC_RELEASE_SOURCE']}
          env_vars={k:{'type':'plain_text','value':v} for k,v in values.items()}
          body=json.dumps({'deployment_configs':{'production':{'env_vars':env_vars,'fail_open':False},'preview':{'env_vars':env_vars,'fail_open':False}}}).encode()
          req=urllib.request.Request(f'https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects/{project}',data=body,method='PATCH',headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'})
          result=json.load(urllib.request.urlopen(req,timeout=30))
          assert result['success'] and result['result']['name']==project
          assert set(result['result']['deployment_configs']['production']['env_vars'])==set(env_vars)
          PY

      - name: Deploy exact V2 to staging
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: c63d3d6d8c17db7487ab40b81d5e29d1
          packageManager: npm
          command: >-
            pages deploy .vercel/output/static
            --project-name=ubuntu-town-workspace-v2-staging
            --branch=staging-control
            --commit-hash=bfeb53be0a6ed30ecfdb047b280fd69c66e10133
            --commit-message="H-02 Living Town First Durable Loop"
            --commit-dirty=false

      - name: Post-deploy attestation
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.error, urllib.request
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']; token=os.environ['CLOUDFLARE_API_TOKEN']
          expected=os.environ['V2_SHA']; project=os.environ['CF_PROJECT_EXPECTED']
          def get(path):
              req=urllib.request.Request('https://api.cloudflare.com/client/v4'+path,headers={'Authorization':'Bearer '+token})
              return json.load(urllib.request.urlopen(req,timeout=30))['result']
          receipt={'source_sha':expected,'project':project,'production_changed':'UNKNOWN','routes':{}}
          time.sleep(5)
          deployments=get(f'/accounts/{account}/pages/projects/{project}/deployments?env=production&per_page=5')
          match=next((d for d in deployments if d['deployment_trigger']['metadata'].get('commit_hash')==expected and d['latest_stage']['status']=='success'),None)
          assert match, 'successful expected staging deployment not found'
          receipt.update(deployment_id=match['id'],deployment_url=match['url'],branch=match['deployment_trigger']['metadata'].get('branch'),environment=match['environment'])
          assert match['project_name']==project and match['environment']=='production' and match['deployment_trigger']['metadata'].get('branch')=='staging-control'
          for route in ['/','/login','/living-town','/living-town/mission','/living-town/work']:
              url='https://ubuntu-town-workspace-v2-staging.pages.dev'+route
              request=urllib.request.Request(url,method='GET')
              opener=urllib.request.build_opener(urllib.request.HTTPRedirectHandler())
              try:
                  response=opener.open(request,timeout=30)
                  status=response.status; final=response.url
              except urllib.error.HTTPError as e:
                  status=e.code; final=e.url
              receipt['routes'][route]={'status':status,'final_url':final}
              assert status < 500
              if route.startswith('/living-town'): assert status in (200,302,303,307,308), f'{route} returned {status}'
          receipt['production_commit']='947f78b745f9e4c5cdecaf32e9e1f7442335423f'
          receipt['production_deployment']='a7f6827c-5bf8-4f0b-9374-8d1e05a19430'
          receipt['production_changed']='NO'
          open('commissioning-receipt.json','w').write(json.dumps(receipt,indent=2,sort_keys=True))
          print(json.dumps(receipt,sort_keys=True))
          PY

      - name: Upload commissioning receipt
        uses: actions/upload-artifact@v4
        with:
          name: h-02-commissioning-receipt
          path: commissioning-receipt.json
